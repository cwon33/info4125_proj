# Deploy the UI and the existing Python recommender as one service.
services:
  - type: web
    name: cornell-clubquest
    runtime: python
    plan: free
    rootDir: club_recommender
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
