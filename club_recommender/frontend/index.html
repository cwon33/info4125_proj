<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#8d242a" />
    <meta
      name="description"
      content="Find a little more of your people at Cornell. Explore clubs and get recommendations around your interests, time, and kind of community."
    />
    <title>ClubQuest — Find your people at Cornell</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/assets/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a href="#home" class="brand" aria-label="ClubQuest home"
          ><span class="brand-mark" aria-hidden="true">c<span>✳</span></span
          ><span>clubquest<span class="brand-campus">AT CORNELL</span></span></a
        >
        <nav aria-label="Main navigation">
          <a href="#explore" data-nav="explore">Explore clubs</a
          ><a href="#saved" data-nav="saved"
            >Saved <span class="saved-count" id="saved-count">0</span></a
          ><a href="#quiz" class="nav-cta" data-nav="quiz"
            >Find my clubs <span aria-hidden="true">↗</span></a
          >
        </nav>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer">
      <a href="#home" class="footer-wordmark">clubquest<span>✳</span></a>
      <p>A student project. A few more ways to belong.</p>
      <span>Made for Cornell students · Independently built</span>
    </footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="club-dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
    <noscript
      ><p class="noscript">
        Please enable JavaScript to explore clubs and take the quiz.
      </p></noscript
    >
  </body>
</html>
