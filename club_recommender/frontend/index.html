<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cornell Club Recommender</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;background:#fafafa;color:#222}
.card{background:white;border:1px solid #ddd;border-radius:14px;padding:28px;margin-top:20px}
h1{margin-bottom:4px}.muted{color:#666}
.option{display:block;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;cursor:pointer}
.option:hover{background:#f5f5f5}
button{margin-top:18px;padding:11px 18px;border:0;border-radius:9px;background:#222;color:#fff;cursor:pointer}
.result{border:1px solid #ddd;border-radius:12px;padding:18px;margin:12px 0;background:#fff}
.score{font-weight:700}.reason{display:inline-block;background:#f0f0f0;border-radius:999px;padding:5px 9px;margin:4px 4px 0 0;font-size:13px}
textarea{width:100%;min-height:130px;box-sizing:border-box}
</style>
</head>
<body>
<h1>Find your Cornell clubs</h1>
<div class="muted" id="progress"></div>
<div id="app" class="card"></div>

<script>
const API = "";
let answers = {};
let question = null;
let asked = [];

async function start(){
  const r = await fetch(API+"/quiz/start");
  const d = await r.json();
  question = d.question;
  render();
}
function render(){
  const el = document.getElementById("app");
  if(!question){return;}
  document.getElementById("progress").textContent =
    "Question " + (asked.length + 1);
  let html = `<h2>${question.question}</h2>`;
  if(question.type === "text"){
    html += `<textarea id="textAnswer" placeholder="Tell us what you're looking for..."></textarea>`;
  } else {
    html += question.options.map(o =>
      `<label class="option"><input type="${question.type==='single'?'radio':'checkbox'}"
        name="answer" value="${o.id}"> ${o.label}</label>`
    ).join("");
  }
  html += `<button onclick="submitAnswer()">Continue</button>`;
  el.innerHTML = html;
}
async function submitAnswer(){
  let value;
  if(question.type === "text"){
    value = document.getElementById("textAnswer").value;
  } else {
    const checked = [...document.querySelectorAll('input[name="answer"]:checked')].map(x=>x.value);
    if(!checked.length){alert("Please select an option.");return;}
    value = question.type === "single" ? checked[0] : checked;
  }
  answers[question.id] = value;
  asked.push(question.id);

  const r = await fetch(API+"/quiz/next", {
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({answers})
  });
  const d = await r.json();
  if(!d.question){return showResults();}
  question = d.question;
  render();
}
async function showResults(){
  document.getElementById("progress").textContent = "Your recommendations";
  const r = await fetch(API+"/recommend", {
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({answers,top_n:10})
  });
  const d = await r.json();
  document.getElementById("app").innerHTML =
    `<h2>Clubs you might like</h2>` +
    d.recommendations.map((x,i)=>`
      <div class="result">
        <h3>${i+1}. ${x.club_name}</h3>
        <div class="score">${x.match_percent}% match</div>
        <p>${x.summary}</p>
        ${x.reasons.map(r=>`<span class="reason">${r}</span>`).join("")}
      </div>`).join("");
}
start();
</script>
</body>
</html>
